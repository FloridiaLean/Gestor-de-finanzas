
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de finanzas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app">
        
        <aside class="sidebar">
            <h2>Finanzas</h2>
            
            <nav>
                <a class="active" href="/">Dashboard</a>
                <a href="#">Cuentas</a>
                <a href="#">Operaciones</a>
                <a href="#">Categorías</a>
                <a href="#">Resumen</a>
            </nav>
        </aside>

        <main class="main">
            <header class="header">
                <div>
                    <p class="eyebrow">GESTOR PERSONAL</p>
                    <h1>Dashboard</h1>
                </div>
            </header>

            <section class="summary">
                <article class="card">
                    <p>Saldo total</p>
                    <h2>—</h2>
                    <span>ARS / USD</span>
                </article>

                <article class="card">
                    <p>Ingresos del mes</p>
                    <h2>—</h2>
                    <span>Este mes</span>
                </article>

                <article class="card">
                    <p>Gastos del mes</p>
                    <h2>—</h2>
                    <span>Este mes</span>
                </article>
            </section>

            <section class="panel">
                <h2>Últimas operaciones</h2>
                <p class="empty">Todavía no hay operaciones para mostrar.</p>
            </section>
        </main>

    </div>
</body>
</html>
